content: QbField('content', dtype=<class 'str'>, doc='Content of the comment')
ctime: QbField('ctime', dtype=<class 'datetime.datetime'>, doc='Creation time of the
  comment')
mtime: QbField('mtime', dtype=<class 'datetime.datetime'>, doc='Modified time of the
  comment')
node: QbField('node', dtype=<class 'int'>, doc='Node PK that the comment is attached
  to')
pk: QbField('pk', dtype=<class 'int'>, doc='The primary key of the entity')
user: QbField('user', dtype=<class 'int'>, doc='User PK that created the comment')
uuid: QbField('uuid', dtype=<class 'uuid.UUID'>, doc='The UUID of the comment')
