attributes: QbAttributesField('attributes', dtype=dict[str, typing.Any], doc='The
  node attributes')
computer: QbField('computer', dtype=int | None, doc='The PK of the computer')
ctime: QbField('ctime', dtype=<class 'datetime.datetime'>, doc='The creation time
  of the node')
description: QbField('description', dtype=<class 'str'>, doc='The node description')
extras: QbField('extras', dtype=dict[str, typing.Any], doc='The node extras')
filename: QbField('attributes.filename', dtype=<class 'str'>, doc='The name of the
  stored file')
formulae: QbField('attributes.formulae', dtype=list[str] | None, doc='List of formulae
  contained in the CIF file')
label: QbField('label', dtype=<class 'str'>, doc='The node label')
md5: QbField('attributes.md5', dtype=str | None, doc='MD5 checksum of the file contents')
mtime: QbField('mtime', dtype=<class 'datetime.datetime'>, doc='The modification time
  of the node')
node_type: QbField('node_type', dtype=<class 'str'>, doc='The type of the node.')
parse_policy: QbField('attributes.parse_policy', dtype=typing.Literal['eager', 'lazy'],
  doc='Parse policy for parsing with PyCIFRW')
pk: QbField('pk', dtype=<class 'int'>, doc='The primary key of the entity')
process_type: QbField('process_type', dtype=str | None, doc='The process type of the
  node')
repository_metadata: QbField('repository_metadata', dtype=dict[str, typing.Any], doc='Virtual
  hierarchy of the file repository')
scan_type: QbField('attributes.scan_type', dtype=typing.Literal['standard', 'flex'],
  doc='Scan type for parsing with PyCIFRW')
source: QbField('attributes.source', dtype=dict | None, doc='Source of the data')
spacegroup_numbers: QbField('attributes.spacegroup_numbers', dtype=list[str] | None,
  doc='List of space group numbers of the structure')
user: QbField('user', dtype=<class 'int'>, doc='The PK of the user who owns the node')
uuid: QbField('uuid', dtype=<class 'uuid.UUID'>, doc='The UUID of the node')
